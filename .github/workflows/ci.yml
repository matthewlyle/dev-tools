name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Build for iOS Simulator
        run: xcodebuild -project DevTools.xcodeproj -scheme DevTools -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData/Build CODE_SIGNING_ALLOWED=NO build
      - name: Test on macOS
        run: xcodebuild -project DevTools.xcodeproj -scheme DevTools -destination 'platform=macOS' -derivedDataPath DerivedData/Build CODE_SIGNING_ALLOWED=NO test
